<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜립 초대 링크</title>
    <style>
      :root {
        color: #202124;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      .fallback {
        width: min(100% - 48px, 360px);
        display: none;
        gap: 12px;
        text-align: center;
      }

      body.ready .fallback {
        display: grid;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        line-height: 1.3;
      }

      p {
        margin: 0 0 12px;
        color: #5f6368;
        font-size: 15px;
        line-height: 1.5;
      }

      button,
      a {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #ffffff;
        background: #1a73e8;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      .secondary {
        color: #1a73e8;
        background: #e8f0fe;
      }
    </style>
  </head>
  <body>
    <main class="fallback">
      <h1>튜립 초대 링크</h1>
      <p>앱이 자동으로 열리지 않으면 아래 버튼을 눌러 다시 시도해주세요.</p>
      <button type="button" onclick="openTuripApp()">앱으로 열기</button>
      <button type="button" class="secondary" onclick="openExternalBrowser()">
        외부 브라우저로 열기
      </button>
      <button type="button" class="secondary" onclick="openPlayStore()">
        앱 설치하기
      </button>
    </main>
    <noscript>
      <a href="https://play.google.com/store/apps/details?id=com.on.turip">
        튜립 앱 설치하기
      </a>
    </noscript>
    <script>
      const ANDROID_PACKAGE = "com.on.turip";

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const invitationUrl = new URL("https://invite.turip.kro.kr/invitations/");
      if (token) {
        invitationUrl.searchParams.set("token", token);
      }

      const storeUrl = new URL("https://play.google.com/store/apps/details");
      storeUrl.searchParams.set("id", ANDROID_PACKAGE);
      if (token) {
        storeUrl.searchParams.set("referrer", token);
      }

      const intentUrl =
        `intent://${invitationUrl.host}${invitationUrl.pathname}${invitationUrl.search}` +
        `#Intent;scheme=https;package=${ANDROID_PACKAGE};` +
        `S.browser_fallback_url=${encodeURIComponent(storeUrl.toString())};end`;

      const isKakao = /KAKAOTALK/i.test(navigator.userAgent);
      let fallbackTimer = null;

      function cancelFallback() {
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
      }

      function showFallback() {
        document.body.classList.add("ready");
      }

      function scheduleFallback() {
        cancelFallback();
        fallbackTimer = setTimeout(() => {
          if (!document.hidden) {
            showFallback();
          }
        }, 1800);
      }

      function openTuripApp() {
        location.href = intentUrl;
        scheduleFallback();
      }

      function openPlayStore() {
        location.href = storeUrl.toString();
      }

      function openExternalBrowser() {
        const out = invitationUrl.toString();
        location.href =
          "kakaotalk://web/openExternal?url=" + encodeURIComponent(out);
        scheduleFallback();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelFallback();
        }
      });
      window.addEventListener("pagehide", cancelFallback);

      if (isKakao) {
        openExternalBrowser();
      } else {
        openTuripApp();
      }
    </script>
  </body>
</html>
