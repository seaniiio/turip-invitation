<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜립 앱 설치</title>
  </head>
  <body>
    <script>
      const ANDROID_PACKAGE = "com.on.turip";

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      let storeUrl =
        "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
      if (token) {
        storeUrl += "&referrer=" + token;
      }

      const isKakao = /KAKAOTALK/i.test(navigator.userAgent);
      const u = new URL(location.href);
      const ext = u.searchParams.get("ext");

      if (isKakao && !ext) {
        // 1) 카카오 인앱 브라우저 → 외부 브라우저로 탈출 (ext=1 마킹)
        u.searchParams.set("ext", "1");
        const out = u.toString();
        location.href =
          "kakaotalk://web/openExternal?url=" + encodeURIComponent(out);
        // openExternal 실패 대비 fallback
        setTimeout(() => {
          location.replace(out);
        }, 800);
      } else if (ext === "2") {
        // 3) App Link 시도 후 앱이 열리지 않은 경우 → Play Store
        location.replace(storeUrl);
      } else {
        // 2) 외부 브라우저에서 App Link 시도 (ext=2로 재시도 방지)
        u.searchParams.set("ext", "2");
        location.replace(u.toString());
        // 앱이 열리면 페이지 언로드, 열리지 않으면 ext=2 페이지 로드 → Play Store
        setTimeout(() => {
          location.replace(storeUrl);
        }, 1500);
      }
    </script>
  </body>
</html>
