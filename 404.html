<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜립 앱 설치</title>
  </head>
  <body>
    <script>
      const ANDROID_PACKAGE = "com.on.turip";

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      let storeUrl =
        "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
      if (token) {
        storeUrl += "&referrer=" + token;
      }

      const isKakao = /KAKAOTALK/i.test(navigator.userAgent);
      const u = new URL(location.href);
      const ext = u.searchParams.get("ext");

      if (isKakao && !ext) {
        // 1) 카카오 인앱 브라우저 → 외부 브라우저로 탈출 (ext=1 마킹)
        u.searchParams.set("ext", "1");
        const out = u.toString();
        location.href =
          "kakaotalk://web/openExternal?url=" + encodeURIComponent(out);
        // openExternal 실패 대비 fallback
        setTimeout(() => {
          location.replace(out);
        }, 800);
      } else {
        // 2) 비-카카오 브라우저: App Link는 Chrome이 URL을 열 때 이미 시도됨
        // HTML이 로드됐다는 것 = 앱 미설치 or App Link 실패 → Play Store
        location.replace(storeUrl);
      }
    </script>
  </body>
</html>
