<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>튜립 앱 설치</title>
  </head>
  <body>
    <script>
      const ANDROID_PACKAGE = "com.on.turip";

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      let storeUrl =
        "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
      if (token) {
        storeUrl += "&referrer=" + token;
      }

      // 카카오톡 인앱 브라우저: intent:// 스킴으로 앱 직접 실행 시도
      // 앱 미설치 시 browser_fallback_url(플레이스토어)로 자동 이동
      if (/KAKAOTALK/i.test(navigator.userAgent)) {
        location.href =
          "intent://" +
          location.host +
          location.pathname +
          location.search +
          "#Intent;scheme=https;package=" +
          ANDROID_PACKAGE +
          ";S.browser_fallback_url=" +
          encodeURIComponent(storeUrl) +
          ";end";
      } else {
        // 페이지 로드 시 자동으로 플레이스토어로 리디렉션 (히스토리 제거 후 이동)
        window.location.replace(storeUrl);
      }
    </script>
  </body>
</html>
